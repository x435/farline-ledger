name: baseline-ci

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install optional renderer dependency
        run: python -m pip install -r requirements.txt
      - name: Compile package
        run: python -m compileall -q farline
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Instantiate baseline game state
        run: |
          python - <<'PY'
          from farline.game import Game
          from farline.models import GameState

          state = GameState.fresh("CI Pilot", seed=7)
          game = Game(state)

          assert state.active == "s1"
          assert game.system == "hinge"
          assert state.character.balance == 120_000
          assert state.seed == 7
          print("Farline Ledger baseline smoke check passed.")
          PY
